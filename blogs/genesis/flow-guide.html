<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="../blog-auth.css">
  <script src="../blog-auth.config.js"></script>
  <script src="../blog-crypto.js"></script>
  <script src="../blog-auth.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genesis World 交互式流程导览 | Universal Physics Engine</title>
  <style>
    :root {
      --bg: #060a0f;
      --surface: #0c1219;
      --surface-2: #131b26;
      --border: #1e2d3d;
      --text: #e8edf4;
      --muted: #7d92a8;
      --accent: #10b981;
      --accent-2: #06b6d4;
      --accent-dim: #059669;
      --blue: #38bdf8;
      --purple: #a78bfa;
      --orange: #fb923c;
      --pink: #f472b6;
      --cyan: #22d3ee;
      --green: #34d399;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; }

    .hero {
      position: relative; padding: 4rem 2rem 3rem;
      background: linear-gradient(135deg, #060a0f 0%, #0a1520 45%, #061210 100%);
      border-bottom: 1px solid var(--border); overflow: hidden;
    }
    .hero::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 20% 45%, rgba(16,185,129,.12) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 20%, rgba(6,182,212,.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-inner { max-width: 1200px; margin: 0 auto; position: relative; }
    .badge-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .25rem .75rem; border-radius: 999px;
      font-size: .75rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface);
    }
    .badge.paper { border-color: #ef4444; color: #fca5a5; }
    .badge.pkg { border-color: var(--accent); color: var(--green); }
    h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; line-height: 1.2; margin-bottom: .75rem; }
    h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { font-size: 1.1rem; color: var(--muted); max-width: 820px; margin-bottom: 1.5rem; }
    .hero-links { display: flex; flex-wrap: wrap; gap: .75rem; }
    .hero-links a {
      padding: .5rem 1.25rem; border-radius: 8px; text-decoration: none;
      font-size: .875rem; font-weight: 600; transition: all .2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
    .btn-outline:hover { border-color: var(--accent); color: var(--green); }
    .hero-img { margin-top: 2rem; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    .hero-img img { width: 100%; display: block; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    section { padding: 3.5rem 0; border-bottom: 1px solid var(--border); }
    section h2 { font-size: 1.6rem; margin-bottom: .5rem; display: flex; align-items: center; gap: .75rem; }
    section h2 .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
      font-size: .9rem; font-weight: 800;
    }
    .section-desc { color: var(--muted); margin-bottom: 2rem; max-width: 820px; }

    .nav-sticky {
      position: sticky; top: 0; z-index: 100;
      background: rgba(6,10,15,.93); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .75rem 0;
    }
    .nav-tabs { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem; }
    .nav-tab {
      flex-shrink: 0; padding: .4rem 1rem; border-radius: 8px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface); }
    .nav-tab.active { background: var(--surface-2); border-color: var(--accent); color: var(--green); }

    .arch-stack { display: grid; gap: 1rem; }
    .arch-layer {
      display: grid; grid-template-columns: 120px 1fr; gap: 1.25rem; align-items: start;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem 1.5rem; border-left: 3px solid var(--accent);
    }
    .arch-layer h4 { font-size: .95rem; color: var(--green); margin-bottom: .35rem; }
    .arch-layer p { font-size: .82rem; color: var(--muted); }
    .arch-layer .file-ref { font-family: var(--mono); font-size: .7rem; color: var(--cyan); display: block; margin-top: .5rem; }
    .arch-layer .layer-label { font-size: .75rem; font-weight: 700; color: var(--accent-2); text-transform: uppercase; letter-spacing: .05em; padding-top: .2rem; }

    .arch-flow { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-top: 1.5rem; }
    .arch-node {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1rem; text-align: center; transition: transform .2s, border-color .2s;
    }
    .arch-node:hover { transform: translateY(-2px); border-color: var(--accent); }
    .arch-node .icon { font-size: 1.5rem; margin-bottom: .35rem; }
    .arch-node h4 { font-size: .82rem; margin-bottom: .2rem; }
    .arch-node p { font-size: .68rem; color: var(--muted); }

    .pipeline { display: flex; flex-direction: column; gap: 0; }
    .phase { display: grid; grid-template-columns: 48px 1fr; gap: 1.25rem; position: relative; }
    .phase:not(:last-child) .phase-line::after {
      content: ""; position: absolute; left: 23px; top: 48px; bottom: 0; width: 2px; background: var(--border);
    }
    .phase-dot {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .85rem; flex-shrink: 0;
      border: 2px solid var(--border); background: var(--surface); position: relative; z-index: 1;
    }
    .phase.open .phase-dot, .phase.active .phase-dot {
      border-color: var(--accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
    }
    .phase-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 1.25rem; overflow: hidden;
    }
    .phase.open .phase-card { border-color: var(--accent-dim); }
    .phase-header {
      padding: 1.25rem 1.5rem; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; user-select: none;
    }
    .phase-header:hover { background: var(--surface-2); }
    .phase-title { font-size: 1.05rem; font-weight: 600; }
    .phase-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .35rem; }
    .tag { font-size: .7rem; padding: .15rem .5rem; border-radius: 4px; font-weight: 600; }
    .tag-phys { background: rgba(16,185,129,.15); color: var(--green); }
    .tag-api { background: rgba(56,189,248,.15); color: var(--blue); }
    .tag-gpu { background: rgba(6,182,212,.15); color: var(--cyan); }
    .tag-sim { background: rgba(251,146,60,.15); color: var(--orange); }
    .chevron { transition: transform .3s; color: var(--muted); font-size: 1.2rem; }
    .phase.open .chevron { transform: rotate(180deg); }
    .phase-body { display: none; padding: 0 1.5rem 1.5rem; border-top: 1px solid var(--border); }
    .phase.open .phase-body { display: block; }
    .step-list { list-style: none; margin-top: 1rem; }
    .step-list li {
      padding: .75rem 0; border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start;
    }
    .step-list li:last-child { border-bottom: none; }
    .step-num {
      width: 28px; height: 28px; border-radius: 6px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0;
    }
    .step-content h5 { font-size: .9rem; margin-bottom: .25rem; }
    .step-content p { font-size: .82rem; color: var(--muted); }
    .step-content .file-ref { font-family: var(--mono); font-size: .72rem; color: var(--cyan); margin-top: .35rem; display: block; }
    .cli-cmd {
      display: block; margin-top: .4rem; padding: .4rem .6rem; border-radius: 6px;
      background: #0d1117; font-family: var(--mono); font-size: .72rem; color: var(--green);
      border: 1px solid var(--border); word-break: break-all; white-space: pre-wrap;
    }

    .solver-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .solver-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.15rem; transition: border-color .2s;
    }
    .solver-card:hover { border-color: var(--accent); }
    .solver-card h4 { font-size: .9rem; color: var(--green); margin-bottom: .35rem; }
    .solver-card .solver-path { font-family: var(--mono); font-size: .68rem; color: var(--cyan); margin-bottom: .5rem; display: block; }
    .solver-card p { font-size: .78rem; color: var(--muted); }
    .solver-card .example { font-family: var(--mono); font-size: .68rem; color: var(--orange); margin-top: .5rem; display: block; }

    .code-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; }
    .code-tab {
      padding: .45rem .9rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: .8rem; cursor: pointer;
    }
    .code-tab.active { border-color: var(--accent); color: var(--green); background: rgba(16,185,129,.08); }
    .code-panel { display: none; }
    .code-panel.active { display: block; }
    .code-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .code-card-header {
      padding: .85rem 1.15rem; background: var(--surface-2);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .code-card-header h4 { font-size: .9rem; }
    .code-body {
      padding: 1.15rem; max-height: 420px; overflow-y: auto;
      font-family: var(--mono); font-size: .76rem; line-height: 1.65;
      white-space: pre-wrap; color: #c8d6e5; background: #0d1117;
    }
    .copy-btn {
      padding: .3rem .65rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: .72rem; cursor: pointer;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--green); }

    .cli-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .cli-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.15rem; }
    .cli-card code { font-family: var(--mono); font-size: .88rem; color: var(--orange); display: block; margin-bottom: .4rem; }
    .cli-card p { font-size: .8rem; color: var(--muted); }

    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .gallery img { width: 100%; border-radius: var(--radius); border: 1px solid var(--border); }

    .loop-diagram {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: .75rem; padding: 1.5rem; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius); margin-top: 1rem;
    }
    .loop-box {
      padding: .55rem 1rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); font-size: .8rem; font-weight: 600; text-align: center;
    }
    .loop-arrow { color: var(--accent); font-size: 1.1rem; font-weight: 700; }

    footer { padding: 2rem; text-align: center; color: var(--muted); font-size: .8rem; }
    footer a { color: var(--green); text-decoration: none; }

    .genesis-site-topbar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(6,10,15,.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .65rem 2rem;
    }
    .genesis-site-topbar-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
    }
    .genesis-site-back { color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 500; }
    .genesis-site-back:hover { color: var(--green); }
    .genesis-site-sep { color: var(--border); }
    .genesis-site-label { margin-left: auto; font-size: .8rem; color: var(--muted); }

    @media (max-width: 640px) {
      .hero { padding: 2.5rem 1rem 2rem; }
      .container { padding: 0 1rem; }
      section { padding: 2.5rem 0; }
      .genesis-site-topbar { padding: .65rem 1rem; }
      .genesis-site-label { width: 100%; margin-left: 0; }
      .arch-layer { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="blog-encrypted-root" class="blog-encrypted-root" data-enc="flow-guide.enc.json" hidden aria-hidden="true">
  <p class="blog-encrypted-placeholder">内容已加密，请输入访问密码解锁。</p>
</div>
<script src="../../site-paths.js"></script>
<script>
(function () {
  function fixHref(id, fallback) {
    var el = document.getElementById(id);
    if (!el) return;
    if (window.SITE_PATHS) {
      if (id === "site-back-blogs" && window.SITE_PATHS.blogs) el.href = window.SITE_PATHS.blogs;
      if (id === "site-back-home" && window.SITE_PATHS.home) el.href = window.SITE_PATHS.home;
    } else {
      el.href = fallback;
    }
  }
  fixHref("site-back-blogs", "../");
  fixHref("site-back-home", "../../");
})();
</script>
</body>
</html>
