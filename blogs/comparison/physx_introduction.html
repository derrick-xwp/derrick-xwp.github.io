<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="../blog-auth.css">
  <script src="../blog-auth.config.js"></script>
  <script src="../blog-crypto.js"></script>
  <script src="../blog-auth.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhysX-Anything 介绍 | Simulation-Ready Physical 3D Assets</title>
  <style>
    :root {
      --bg: #090a10;
      --surface: #10131c;
      --surface-2: #171c2a;
      --border: #2a3144;
      --text: #e8edf4;
      --muted: #8b9bb0;
      --accent: #a78bfa;
      --accent-2: #22d3ee;
      --accent-dim: #7c3aed;
      --purple: #a78bfa;
      --cyan: #22d3ee;
      --orange: #fb923c;
      --pink: #f472b6;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
    }


    .sage-site-topbar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(9,10,16,.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .65rem 2rem;
    }
    .sage-site-topbar-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
    }
    .sage-site-back { color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 500; }
    .sage-site-back:hover { color: var(--accent); }
    .sage-site-sep { color: var(--border); }
    .sage-site-label { margin-left: auto; font-size: .8rem; color: var(--muted); }
    @media (max-width: 640px) {
      .sage-site-topbar { padding: .65rem 1rem; }
      .sage-site-label { width: 100%; margin-left: 0; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.65; }

    .hero {
      position: relative;
      padding: 4rem 2rem 3rem;
      background: linear-gradient(135deg, #090a10 0%, #12102a 40%, #0a1520 100%);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(167,139,250,.12) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 30%, rgba(34,211,238,.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-inner { max-width: 1200px; margin: 0 auto; position: relative; }
    .badge-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .25rem .75rem; border-radius: 999px;
      font-size: .75rem; font-weight: 600; letter-spacing: .03em;
      border: 1px solid var(--border); background: var(--surface);
    }
    .badge.paper { border-color: #ef4444; color: #fca5a5; }
    .badge.dataset { border-color: var(--cyan); color: var(--cyan); }
    .badge.conf { border-color: var(--purple); color: var(--purple); }
    h1 {
      font-size: clamp(1.9rem, 4vw, 2.8rem);
      font-weight: 700; line-height: 1.2; margin-bottom: .75rem;
    }
    h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle { font-size: 1.08rem; color: var(--muted); max-width: 860px; margin-bottom: 1.5rem; }
    .hero-links { display: flex; flex-wrap: wrap; gap: .75rem; }
    .hero-links a {
      padding: .5rem 1.25rem; border-radius: 8px; text-decoration: none;
      font-size: .875rem; font-weight: 600; transition: all .2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.12); }
    .btn-outline { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
    .btn-outline:hover { border-color: var(--accent); color: var(--purple); }
    .hero-img {
      margin-top: 2rem; border-radius: var(--radius);
      overflow: hidden; border: 1px solid var(--border);
    }
    .hero-img img { width: 100%; display: block; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    section { padding: 3.5rem 0; border-bottom: 1px solid var(--border); }
    section h2 {
      font-size: 1.55rem; margin-bottom: .5rem;
      display: flex; align-items: center; gap: .75rem;
    }
    section h2 .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      color: #fff; font-size: .9rem; font-weight: 800;
    }
    section h3 { font-size: 1.12rem; margin: 2rem 0 1rem; color: var(--text); }
    .section-desc { color: var(--muted); margin-bottom: 2rem; max-width: 900px; }

    .nav-sticky {
      position: sticky; top: 2.75rem; z-index: 100;
      background: rgba(9,10,16,.93); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .75rem 0;
    }
    .nav-tabs { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem; }
    .nav-tab {
      flex-shrink: 0; padding: .4rem 1rem; border-radius: 8px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: .85rem; font-weight: 500;
      cursor: pointer; transition: all .2s; white-space: nowrap; text-decoration: none;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface); }
    .nav-tab.active { background: var(--surface-2); border-color: var(--accent); color: var(--purple); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .summary-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }
    .summary-card.purple { border-top: 3px solid var(--purple); }
    .summary-card.cyan { border-top: 3px solid var(--cyan); }
    .summary-card.orange { border-top: 3px solid var(--orange); }
    .summary-card h4 { font-size: 1rem; margin-bottom: .75rem; }
    .summary-card p { font-size: .88rem; color: var(--muted); }
    .summary-card ul { margin-top: .75rem; padding-left: 1.2rem; font-size: .85rem; color: var(--muted); }
    .summary-card li { margin-bottom: .35rem; }

    .arch-flow {
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }
    .arch-node {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.1rem; text-align: center;
      transition: transform .2s, border-color .2s;
    }
    .arch-node:hover { transform: translateY(-2px); border-color: var(--accent); }
    .arch-node .icon { font-size: 1.6rem; margin-bottom: .4rem; }
    .arch-node h4 { font-size: .85rem; margin-bottom: .2rem; }
    .arch-node p { font-size: .72rem; color: var(--muted); }
    .arch-node .model-tag {
      display: inline-block; margin-top: .4rem; padding: .12rem .45rem;
      border-radius: 4px; font-size: .62rem; font-weight: 600;
      background: var(--surface-2); color: var(--cyan);
    }

    .loop-diagram {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: .75rem; padding: 1.5rem; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius); margin-top: 1.5rem;
    }
    .loop-box {
      padding: .6rem 1rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); font-size: .82rem; font-weight: 600; text-align: center;
    }
    .loop-arrow { color: var(--accent); font-size: 1.1rem; font-weight: 700; }

    .pipeline { display: flex; flex-direction: column; gap: 0; }
    .phase { display: grid; grid-template-columns: 48px 1fr; gap: 1.25rem; position: relative; }
    .phase:not(:last-child) .phase-line::after {
      content: ""; position: absolute; left: 23px; top: 48px; bottom: 0;
      width: 2px; background: var(--border);
    }
    .phase-dot {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .85rem; flex-shrink: 0;
      border: 2px solid var(--border); background: var(--surface);
      position: relative; z-index: 1;
    }
    .phase.active .phase-dot {
      border-color: var(--accent);
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      color: #fff;
    }
    .phase-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 1.25rem; overflow: hidden;
    }
    .phase.active .phase-card { border-color: var(--accent-dim); }
    .phase-header {
      padding: 1.25rem 1.5rem; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; user-select: none;
    }
    .phase-header:hover { background: var(--surface-2); }
    .phase-title { font-size: 1.05rem; font-weight: 600; }
    .phase-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .35rem; }
    .tag { font-size: .7rem; padding: .15rem .5rem; border-radius: 4px; font-weight: 600; }
    .tag-vlm { background: rgba(167,139,250,.15); color: var(--purple); }
    .tag-3d { background: rgba(251,146,60,.15); color: var(--orange); }
    .tag-sim { background: rgba(34,211,238,.15); color: var(--cyan); }
    .tag-geo { background: rgba(52,211,153,.15); color: var(--green); }
    .tag-proc { background: rgba(251,191,36,.12); color: var(--yellow); }
    .chevron { transition: transform .3s; color: var(--muted); font-size: 1.2rem; }
    .phase.open .chevron { transform: rotate(180deg); }
    .phase-body { display: none; padding: 0 1.5rem 1.5rem; border-top: 1px solid var(--border); }
    .phase.open .phase-body { display: block; }
    .step-list { list-style: none; margin-top: 1rem; }
    .step-list li {
      padding: .75rem 0; border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start;
    }
    .step-list li:last-child { border-bottom: none; }
    .step-num {
      width: 28px; height: 28px; border-radius: 6px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0;
    }
    .step-content h5 { font-size: .9rem; margin-bottom: .25rem; }
    .step-content p { font-size: .82rem; color: var(--muted); }
    .step-content .file-ref {
      font-family: var(--mono); font-size: .72rem; color: var(--cyan);
      margin-top: .35rem; display: block;
    }
    .cli-cmd {
      display: block; margin-top: .4rem; padding: .4rem .6rem; border-radius: 6px;
      background: #0d1117; font-family: var(--mono); font-size: .72rem;
      color: var(--green); border: 1px solid var(--border); word-break: break-all;
    }

    .table-wrap {
      overflow-x: auto; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface); margin-bottom: 1.5rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th {
      background: var(--surface-2); font-weight: 700; font-size: .78rem;
      text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    code {
      font-family: var(--mono); font-size: .78rem;
      background: var(--surface-2); padding: .15rem .4rem; border-radius: 4px;
      color: var(--cyan); word-break: break-all;
    }

    .joint-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .75rem;
    }
    .joint-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 1rem;
    }
    .joint-card .code { font-family: var(--mono); font-size: 1.1rem; font-weight: 800; color: var(--purple); }
    .joint-card h5 { font-size: .85rem; margin: .35rem 0; }
    .joint-card p { font-size: .78rem; color: var(--muted); }

    .callout {
      border-radius: var(--radius); padding: 1.25rem 1.5rem;
      margin: 1.5rem 0; border: 1px solid var(--border); background: var(--surface);
    }
    .callout.info { border-color: rgba(34,211,238,.35); background: rgba(34,211,238,.05); }
    .callout.warn { border-color: rgba(251,146,60,.4); background: rgba(251,146,60,.06); }
    .callout h4 { margin-bottom: .5rem; font-size: .95rem; }
    .callout p, .callout li { font-size: .88rem; color: var(--muted); }
    .callout ul { padding-left: 1.2rem; margin-top: .5rem; }

    .compare-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1rem;
    }
    .compare-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
    }
    .compare-card h4 { font-size: .95rem; margin-bottom: .5rem; }
    .compare-card.physx { border-left: 3px solid var(--purple); }
    .compare-card.sage { border-left: 3px solid #76b900; }
    .compare-card.embodied { border-left: 3px solid #4da3ff; }
    .compare-card p { font-size: .82rem; color: var(--muted); margin-bottom: .5rem; }
    .compare-card ul { padding-left: 1.1rem; font-size: .8rem; color: var(--muted); }

    .dataset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; }
    .dataset-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }
    .dataset-card h4 { color: var(--cyan); margin-bottom: .5rem; }
    .dataset-card p { font-size: .85rem; color: var(--muted); margin-bottom: .75rem; }
    .dataset-card a { color: var(--purple); font-size: .82rem; text-decoration: none; }
    .dataset-card a:hover { text-decoration: underline; }

    .cli-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .cli-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
    .cli-card code { font-family: var(--mono); font-size: .85rem; color: var(--orange); display: block; margin-bottom: .5rem; }
    .cli-card p { font-size: .82rem; color: var(--muted); }

    footer {
      padding: 2.5rem 2rem; text-align: center;
      color: var(--muted); font-size: .8rem;
    }
    footer a { color: var(--purple); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      .hero { padding: 2.5rem 1rem 2rem; }
      .container { padding: 0 1rem; }
      section { padding: 2.5rem 0; }
    }
  </style>
</head>
<body>
<div id="blog-encrypted-root" class="blog-encrypted-root" data-enc="physx_introduction.enc.json" hidden aria-hidden="true">
  <p class="blog-encrypted-placeholder">内容已加密，请输入访问密码解锁。</p>
</div>
<script src="../../site-paths.js"></script>
<script>
(function () {
  function fixHref(id, fallback) {
    var el = document.getElementById(id);
    if (!el) return;
    if (window.SITE_PATHS) {
      if (id === 'site-back-blogs' && window.SITE_PATHS.blogs) el.href = window.SITE_PATHS.blogs;
      if (id === 'site-back-home' && window.SITE_PATHS.home) el.href = window.SITE_PATHS.home;
    } else {
      el.href = fallback;
    }
  }
  fixHref('site-back-blogs', '../');
  fixHref('site-back-home', '../../');
})();
</script>

</body>
</html>
