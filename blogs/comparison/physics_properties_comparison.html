<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="../blog-auth.css">
  <script src="../blog-auth.config.js"></script>
  <script src="../blog-crypto.js"></script>
  <script src="../blog-auth.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAGE vs EmbodiedGen vs PhysX-Anything 物理属性对比</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-2: #1a2330;
      --border: #2a3544;
      --text: #e8edf4;
      --muted: #8b9bb0;
      --accent: #76b900;
      --accent-dim: #5a8f00;
      --sage: #76b900;
      --embodied: #4da3ff;
      --physx: #a78bfa;
      --blue: #4da3ff;
      --purple: #a78bfa;
      --orange: #fb923c;
      --pink: #f472b6;
      --cyan: #22d3ee;
      --red: #f87171;
      --yellow: #fbbf24;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
    }


    .sage-site-topbar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(11,15,20,.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .65rem 2rem;
    }
    .sage-site-topbar-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
    }
    .sage-site-back { color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 500; }
    .sage-site-back:hover { color: var(--accent); }
    .sage-site-sep { color: var(--border); }
    .sage-site-label { margin-left: auto; font-size: .8rem; color: var(--muted); }
    @media (max-width: 640px) {
      .sage-site-topbar { padding: .65rem 1rem; }
      .sage-site-label { width: 100%; margin-left: 0; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; }

    .hero {
      position: relative;
      padding: 4rem 2rem 3rem;
      background: linear-gradient(135deg, #0b0f14 0%, #101a28 45%, #0f1810 100%);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(118,185,0,.1) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 30%, rgba(77,163,255,.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-inner { max-width: 1200px; margin: 0 auto; position: relative; }
    .badge-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .25rem .75rem; border-radius: 999px;
      font-size: .75rem; font-weight: 600; letter-spacing: .03em;
      border: 1px solid var(--border); background: var(--surface);
    }
    .badge.sage { border-color: var(--sage); color: var(--sage); }
    .badge.embodied { border-color: var(--embodied); color: var(--embodied); }
    .badge.physx { border-color: var(--physx); color: var(--physx); }
    .badge.analysis { border-color: var(--orange); color: var(--orange); }
    h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; line-height: 1.2; margin-bottom: .75rem; }
    h1 .sage { color: var(--sage); }
    h1 .embodied { color: var(--embodied); }
    h1 .physx { color: var(--physx); }
    .subtitle { font-size: 1.05rem; color: var(--muted); max-width: 820px; margin-bottom: 1.5rem; }
    .hero-links { display: flex; flex-wrap: wrap; gap: .75rem; }
    .hero-links a {
      padding: .5rem 1.25rem; border-radius: 8px; text-decoration: none;
      font-size: .875rem; font-weight: 600; transition: all .2s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #8ed100; }
    .btn-outline { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    section { padding: 3.5rem 0; border-bottom: 1px solid var(--border); }
    section h2 {
      font-size: 1.55rem; margin-bottom: .5rem;
      display: flex; align-items: center; gap: .75rem;
    }
    section h2 .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 8px;
      background: var(--accent); color: #000; font-size: .9rem; font-weight: 800;
    }
    section h3 { font-size: 1.15rem; margin: 2rem 0 1rem; color: var(--text); }
    .section-desc { color: var(--muted); margin-bottom: 2rem; max-width: 900px; }

    .nav-sticky {
      position: sticky; top: 2.75rem; z-index: 100;
      background: rgba(11,15,20,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .75rem 0;
    }
    .nav-tabs {
      display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem;
      scrollbar-width: thin;
    }
    .nav-tab {
      flex-shrink: 0; padding: .4rem 1rem; border-radius: 8px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: .85rem; font-weight: 500;
      cursor: pointer; transition: all .2s; white-space: nowrap; text-decoration: none;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface); }
    .nav-tab.active { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .summary-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.5rem;
    }
    .summary-card.sage { border-top: 3px solid var(--sage); }
    .summary-card.embodied { border-top: 3px solid var(--embodied); }
    .summary-card.physx { border-top: 3px solid var(--physx); }
    .summary-card.warn { border-top: 3px solid var(--orange); }
    .summary-card h4 { font-size: 1rem; margin-bottom: .75rem; }
    .summary-card p { font-size: .88rem; color: var(--muted); }
    .summary-card ul { margin-top: .75rem; padding-left: 1.2rem; font-size: .85rem; color: var(--muted); }
    .summary-card li { margin-bottom: .35rem; }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 1.5rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
    th {
      background: var(--surface-2); font-weight: 700; font-size: .78rem;
      text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
      position: sticky; top: 0; z-index: 1;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    code {
      font-family: var(--mono); font-size: .78rem;
      background: var(--surface-2); padding: .15rem .4rem; border-radius: 4px;
      color: var(--cyan); word-break: break-all;
    }

    .status { display: inline-block; padding: .15rem .5rem; border-radius: 4px; font-size: .72rem; font-weight: 700; white-space: nowrap; }
    .status.yes { background: rgba(118,185,0,.15); color: var(--sage); }
    .status.partial { background: rgba(251,146,60,.15); color: var(--orange); }
    .status.no { background: rgba(248,113,113,.12); color: var(--red); }

    .src-tag {
      display: inline-block; margin: .15rem .2rem .15rem 0;
      padding: .12rem .45rem; border-radius: 4px;
      font-size: .68rem; font-weight: 700; letter-spacing: .02em;
    }
    .src-vlm { background: rgba(167,139,250,.15); color: var(--purple); }
    .src-meta { background: rgba(34,211,238,.12); color: var(--cyan); }
    .src-material { background: rgba(251,146,60,.15); color: var(--orange); }
    .src-hardcode { background: rgba(248,113,113,.12); color: var(--red); }
    .src-fallback { background: rgba(251,191,36,.12); color: var(--yellow); }
    .src-config { background: rgba(77,163,255,.12); color: var(--blue); }
    .src-sim { background: rgba(139,155,176,.15); color: var(--muted); }
    .src-geo { background: rgba(118,185,0,.12); color: var(--sage); }
    .src-robot { background: rgba(244,114,182,.12); color: var(--pink); }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: .75rem;
    }
    .legend-item {
      display: flex; align-items: flex-start; gap: .6rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: .75rem 1rem; font-size: .82rem;
    }
    .legend-item p { color: var(--muted); font-size: .78rem; margin-top: .2rem; }

    .callout {
      border-radius: var(--radius); padding: 1.25rem 1.5rem;
      margin: 1.5rem 0; border: 1px solid var(--border);
      background: var(--surface);
    }
    .callout.warn { border-color: rgba(251,146,60,.4); background: rgba(251,146,60,.06); }
    .callout.info { border-color: rgba(77,163,255,.35); background: rgba(77,163,255,.05); }
    .callout h4 { margin-bottom: .5rem; font-size: .95rem; }
    .callout p, .callout li { font-size: .88rem; color: var(--muted); }
    .callout ul { padding-left: 1.2rem; margin-top: .5rem; }

    .risk-bar { display: flex; align-items: center; gap: .75rem; }
    .risk-meter {
      flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden;
    }
    .risk-fill { height: 100%; border-radius: 3px; }
    .risk-low { background: var(--sage); width: 25%; }
    .risk-mid { background: var(--yellow); width: 55%; }
    .risk-high { background: var(--red); width: 90%; }
    .risk-label { font-size: .75rem; font-weight: 700; min-width: 2.5rem; text-align: right; }
    .risk-label.low { color: var(--sage); }
    .risk-label.mid { color: var(--yellow); }
    .risk-label.high { color: var(--red); }

    .compare-flow {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem;
      margin: 2rem 0;
    }
    @media (max-width: 768px) {
      .flow-arrow { display: none; }
    }
    .flow-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
    }
    .flow-box.sage { border-color: rgba(118,185,0,.35); }
    .flow-box.embodied { border-color: rgba(77,163,255,.35); }
    .flow-box.physx { border-color: rgba(167,139,250,.35); }
    .flow-box h4 { font-size: .95rem; margin-bottom: .75rem; }
    .flow-box .step {
      font-size: .8rem; color: var(--muted); padding: .5rem 0;
      border-bottom: 1px dashed var(--border);
      display: flex; align-items: flex-start; gap: .5rem;
    }
    .flow-box .step:last-child { border-bottom: none; }
    .flow-arrow {
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: var(--muted);
    }

    footer {
      padding: 2.5rem 2rem; text-align: center;
      color: var(--muted); font-size: .8rem;
    }
    footer a { color: var(--accent); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div id="blog-encrypted-root" class="blog-encrypted-root" data-enc="physics_properties_comparison.enc.json" hidden aria-hidden="true">
  <p class="blog-encrypted-placeholder">内容已加密，请输入访问密码解锁。</p>
</div>
<script src="../../site-paths.js"></script>
<script>
(function () {
  function fixHref(id, fallback) {
    var el = document.getElementById(id);
    if (!el) return;
    if (window.SITE_PATHS) {
      if (id === 'site-back-blogs' && window.SITE_PATHS.blogs) el.href = window.SITE_PATHS.blogs;
      if (id === 'site-back-home' && window.SITE_PATHS.home) el.href = window.SITE_PATHS.home;
    } else {
      el.href = fallback;
    }
  }
  fixHref('site-back-blogs', '../');
  fixHref('site-back-home', '../../');
})();
</script>

</body>
</html>
