<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Blog · Wenpeng Xing</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="blog-hub-page">
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="https://www.zju.edu.cn" target="_blank" rel="noopener" class="header-zju-logo" title="Zhejiang University"><img src="../zju-logo.png" alt="Zhejiang University"></a>
        <a href="http://ibj.zju.edu.cn/" target="_blank" rel="noopener" class="header-ibj-logo" title="Binjiang Institute of Zhejiang University"><img src="../ibj-logo.png" alt="Binjiang Institute of Zhejiang University"></a>
      </div>
      <div class="header-right">
        <nav class="main-nav" aria-label="Main navigation" id="main-nav"></nav>
        <div class="lang-switcher" role="group" aria-label="Language">
          <select id="lang-select" class="lang-select" aria-label="Language">
            <option value="zh">中文</option>
            <option value="zhtw">繁體</option>
            <option value="en">EN</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="th">ไทย</option>
          </select>
        </div>
      </div>
      <button class="nav-toggle" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </header>

  <nav class="quick-nav" id="quick-nav" aria-label="Quick jump to section"></nav>

  <main id="content" class="blog-hub-main">
    <section class="section blog-hub-section">
      <div class="container">
        <h1 class="blog-hub-title" id="blog-hub-title">技术博客</h1>
        <div class="blog-hub-series" id="blog-hub-series" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer blog-hub-footer">
    <div class="container">
      <p class="copyright">© 2025 <span id="copyright-center-name">Wenpeng Xing</span></p>
    </div>
  </footer>

  <script src="../site-paths.js"></script>
  <script src="../content.js"></script>
  <script src="script.js"></script>
</body>
</html>
