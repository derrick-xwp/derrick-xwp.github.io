<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="../blog-auth.css">
  <script src="../blog-auth.config.js"></script>
  <script src="../blog-crypto.js"></script>
  <script src="../blog-auth.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmbodiedGen 交互式流程导览 | Simulation-Ready 3D World Engine</title>
  <style>
    :root {
      --bg: #080c12;
      --surface: #0f1520;
      --surface-2: #161e2e;
      --border: #243044;
      --text: #e8edf4;
      --muted: #7d8fa8;
      --accent: #3b82f6;
      --accent-2: #f97316;
      --accent-dim: #2563eb;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --orange: #fb923c;
      --pink: #f472b6;
      --cyan: #22d3ee;
      --green: #34d399;
      --radius: 12px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; }

    .hero {
      position: relative; padding: 4rem 2rem 3rem;
      background: linear-gradient(135deg, #080c12 0%, #0d1829 45%, #120f0a 100%);
      border-bottom: 1px solid var(--border); overflow: hidden;
    }
    .hero::before {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 15% 40%, rgba(59,130,246,.14) 0%, transparent 55%),
                  radial-gradient(ellipse at 85% 25%, rgba(249,115,22,.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-inner { max-width: 1200px; margin: 0 auto; position: relative; }
    .badge-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .25rem .75rem; border-radius: 999px;
      font-size: .75rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface);
    }
    .badge.paper { border-color: #ef4444; color: #fca5a5; }
    .badge.dataset { border-color: var(--blue); color: var(--blue); }
    h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; line-height: 1.2; margin-bottom: .75rem; }
    h1 span { background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .subtitle { font-size: 1.1rem; color: var(--muted); max-width: 760px; margin-bottom: 1.5rem; }
    .hero-links { display: flex; flex-wrap: wrap; gap: .75rem; }
    .hero-links a {
      padding: .5rem 1.25rem; border-radius: 8px; text-decoration: none;
      font-size: .875rem; font-weight: 600; transition: all .2s;
    }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-outline { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
    .btn-outline:hover { border-color: var(--accent); color: var(--blue); }
    .hero-img { margin-top: 2rem; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
    .hero-img img { width: 100%; display: block; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    section { padding: 3.5rem 0; border-bottom: 1px solid var(--border); }
    section h2 { font-size: 1.6rem; margin-bottom: .5rem; display: flex; align-items: center; gap: .75rem; }
    section h2 .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
      font-size: .9rem; font-weight: 800;
    }
    .section-desc { color: var(--muted); margin-bottom: 2rem; max-width: 820px; }

    .nav-sticky {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,12,18,.93); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .75rem 0;
    }
    .nav-tabs { display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem; }
    .nav-tab {
      flex-shrink: 0; padding: .4rem 1rem; border-radius: 8px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: .85rem; font-weight: 500; cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface); }
    .nav-tab.active { background: var(--surface-2); border-color: var(--accent); color: var(--blue); }

    .arch-flow { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .arch-node {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.1rem; text-align: center; transition: transform .2s, border-color .2s;
    }
    .arch-node:hover { transform: translateY(-2px); border-color: var(--accent); }
    .arch-node .icon { font-size: 1.6rem; margin-bottom: .4rem; }
    .arch-node h4 { font-size: .85rem; margin-bottom: .2rem; }
    .arch-node p { font-size: .72rem; color: var(--muted); }
    .arch-node .model-tag {
      display: inline-block; margin-top: .4rem; padding: .12rem .45rem; border-radius: 4px;
      font-size: .62rem; font-weight: 600; background: var(--surface-2); color: var(--cyan);
    }

    .pipeline { display: flex; flex-direction: column; gap: 0; }
    .phase { display: grid; grid-template-columns: 48px 1fr; gap: 1.25rem; position: relative; }
    .phase:not(:last-child) .phase-line::after {
      content: ""; position: absolute; left: 23px; top: 48px; bottom: 0; width: 2px; background: var(--border);
    }
    .phase-dot {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .85rem; flex-shrink: 0;
      border: 2px solid var(--border); background: var(--surface); position: relative; z-index: 1;
    }
    .phase.active .phase-dot { border-color: var(--accent); background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
    .phase-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 1.25rem; overflow: hidden;
    }
    .phase.active .phase-card { border-color: var(--accent-dim); }
    .phase-header {
      padding: 1.25rem 1.5rem; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; user-select: none;
    }
    .phase-header:hover { background: var(--surface-2); }
    .phase-title { font-size: 1.05rem; font-weight: 600; }
    .phase-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .35rem; }
    .tag { font-size: .7rem; padding: .15rem .5rem; border-radius: 4px; font-weight: 600; }
    .tag-llm { background: rgba(96,165,250,.15); color: var(--blue); }
    .tag-vlm { background: rgba(167,139,250,.15); color: var(--purple); }
    .tag-3d { background: rgba(251,146,60,.15); color: var(--orange); }
    .tag-sim { background: rgba(34,211,238,.15); color: var(--cyan); }
    .tag-agent { background: rgba(59,130,246,.15); color: var(--accent); }
    .tag-diff { background: rgba(244,114,182,.15); color: var(--pink); }
    .tag-proc { background: rgba(52,211,153,.15); color: var(--green); }
    .chevron { transition: transform .3s; color: var(--muted); font-size: 1.2rem; }
    .phase.open .chevron { transform: rotate(180deg); }
    .phase-body { display: none; padding: 0 1.5rem 1.5rem; border-top: 1px solid var(--border); }
    .phase.open .phase-body { display: block; }
    .step-list { list-style: none; margin-top: 1rem; }
    .step-list li {
      padding: .75rem 0; border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start;
    }
    .step-list li:last-child { border-bottom: none; }
    .step-num {
      width: 28px; height: 28px; border-radius: 6px; background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0;
    }
    .step-content h5 { font-size: .9rem; margin-bottom: .25rem; }
    .step-content p { font-size: .82rem; color: var(--muted); }
    .step-content .file-ref { font-family: var(--mono); font-size: .72rem; color: var(--cyan); margin-top: .35rem; display: block; }
    .cli-cmd {
      display: block; margin-top: .4rem; padding: .4rem .6rem; border-radius: 6px;
      background: #0d1117; font-family: var(--mono); font-size: .72rem; color: var(--green);
      border: 1px solid var(--border); word-break: break-all;
    }
    .prompt-link {
      display: inline-flex; align-items: center; gap: .35rem; margin-top: .5rem;
      padding: .3rem .75rem; border-radius: 6px;
      background: rgba(59,130,246,.1); color: var(--blue);
      border: 1px solid rgba(59,130,246,.3); font-size: .75rem; font-weight: 600; cursor: pointer;
    }
    .prompt-link:hover { background: rgba(59,130,246,.2); }

    .prompt-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
    .prompt-tab {
      padding: .5rem 1rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: .8rem; cursor: pointer;
    }
    .prompt-tab.active { border-color: var(--accent); color: var(--blue); background: rgba(59,130,246,.08); }
    .prompt-panel { display: none; }
    .prompt-panel.active { display: block; }
    .prompt-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .prompt-card-header {
      padding: 1rem 1.25rem; background: var(--surface-2);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
    }
    .prompt-card-header h4 { font-size: .95rem; }
    .prompt-meta { display: flex; gap: .5rem; flex-wrap: wrap; }
    .prompt-body {
      padding: 1.25rem; max-height: 480px; overflow-y: auto;
      font-family: var(--mono); font-size: .78rem; line-height: 1.7;
      white-space: pre-wrap; color: #c8d6e5; background: #0d1117;
    }
    .copy-btn {
      padding: .35rem .75rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: .75rem; cursor: pointer;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--blue); }
    .copy-btn.copied { border-color: var(--accent); color: var(--blue); }

    .model-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .model-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
    .model-card h4 { font-size: .95rem; margin-bottom: .5rem; color: var(--blue); }
    .model-card .model-name { font-family: var(--mono); font-size: .8rem; color: var(--cyan); margin-bottom: .75rem; display: block; }
    .model-tasks { list-style: none; }
    .model-tasks li { font-size: .8rem; color: var(--muted); padding: .25rem 0; padding-left: 1rem; position: relative; }
    .model-tasks li::before { content: "→"; position: absolute; left: 0; color: var(--accent); }

    .cli-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .cli-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
    .cli-card code { font-family: var(--mono); font-size: .9rem; color: var(--orange); display: block; margin-bottom: .5rem; }
    .cli-card p { font-size: .82rem; color: var(--muted); }

    .vibe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .vibe-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 1.25rem; border-left: 3px solid var(--accent-2);
    }
    .vibe-card code { font-family: var(--mono); font-size: .85rem; color: var(--accent-2); display: block; margin-bottom: .4rem; }
    .vibe-card .skill { font-size: .75rem; color: var(--muted); }
    .vibe-card .cli { font-family: var(--mono); font-size: .7rem; color: var(--green); margin-top: .4rem; }

    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .gallery img { width: 100%; border-radius: var(--radius); border: 1px solid var(--border); }

    .loop-diagram {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: .75rem; padding: 1.5rem; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius); margin-top: 1rem;
    }
    .loop-box {
      padding: .6rem 1rem; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); font-size: .82rem; font-weight: 600; text-align: center;
    }
    .loop-arrow { color: var(--accent); font-size: 1.1rem; font-weight: 700; }

    footer { padding: 2rem; text-align: center; color: var(--muted); font-size: .8rem; }
    footer a { color: var(--blue); text-decoration: none; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    @media (max-width: 640px) {
      .hero { padding: 2.5rem 1rem 2rem; }
      .container { padding: 0 1rem; }
      section { padding: 2.5rem 0; }
    }

    .embodiedgen-site-topbar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(8,12,18,.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .65rem 2rem;
    }
    .embodiedgen-site-topbar-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
    }
    .embodiedgen-site-back { color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 500; }
    .embodiedgen-site-back:hover { color: var(--blue); }
    .embodiedgen-site-sep { color: var(--border); }
    .embodiedgen-site-label { margin-left: auto; font-size: .8rem; color: var(--muted); }
    @media (max-width: 640px) {
      .embodiedgen-site-topbar { padding: .65rem 1rem; }
      .embodiedgen-site-label { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="blog-encrypted-root" class="blog-encrypted-root" data-enc="flow-guide.enc.json" hidden aria-hidden="true">
  <p class="blog-encrypted-placeholder">内容已加密，请输入访问密码解锁。</p>
</div>
<script src="../../site-paths.js"></script>
<script>
(function () {
  function fixHref(id, fallback) {
    var el = document.getElementById(id);
    if (!el) return;
    if (window.SITE_PATHS) {
      if (id === "site-back-blogs" && window.SITE_PATHS.blogs) el.href = window.SITE_PATHS.blogs;
      if (id === "site-back-home" && window.SITE_PATHS.home) el.href = window.SITE_PATHS.home;
    } else {
      el.href = fallback;
    }
  }
  fixHref("site-back-blogs", "../");
  fixHref("site-back-home", "../../");
})();
</script>
</body>
</html>
