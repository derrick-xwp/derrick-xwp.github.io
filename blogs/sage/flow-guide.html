<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="stylesheet" href="../blog-auth.css">
  <script src="../blog-auth.config.js"></script>
  <script src="../blog-crypto.js"></script>
  <script src="../blog-auth.js"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAGE 交互式流程导览 | Scalable Agentic 3D Scene Generation</title>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #121820;
      --surface-2: #1a2330;
      --border: #2a3544;
      --text: #e8edf4;
      --muted: #8b9bb0;
      --accent: #76b900;
      --accent-dim: #5a8f00;
      --blue: #4da3ff;
      --purple: #a78bfa;
      --orange: #fb923c;
      --pink: #f472b6;
      --cyan: #22d3ee;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0,0,0,.35);
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
      --mono: "JetBrains Mono", "Fira Code", "Consolas", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* Header */
    .hero {
      position: relative;
      padding: 4rem 2rem 3rem;
      background: linear-gradient(135deg, #0b0f14 0%, #152018 50%, #0b0f14 100%);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, rgba(118,185,0,.12) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(77,163,255,.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-inner { max-width: 1200px; margin: 0 auto; position: relative; }
    .badge-row { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1rem; }
    .badge {
      display: inline-flex; align-items: center; gap: .35rem;
      padding: .25rem .75rem; border-radius: 999px;
      font-size: .75rem; font-weight: 600; letter-spacing: .03em;
      border: 1px solid var(--border); background: var(--surface);
    }
    .badge.paper { border-color: #ef4444; color: #fca5a5; }
    .badge.dataset { border-color: var(--blue); color: var(--blue); }
    h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; line-height: 1.2; margin-bottom: .75rem; }
    h1 span { color: var(--accent); }
    .subtitle { font-size: 1.1rem; color: var(--muted); max-width: 720px; margin-bottom: 1.5rem; }
    .hero-links { display: flex; flex-wrap: wrap; gap: .75rem; }
    .hero-links a {
      padding: .5rem 1.25rem; border-radius: 8px; text-decoration: none;
      font-size: .875rem; font-weight: 600; transition: all .2s;
    }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { background: #8ed100; }
    .btn-outline { border: 1px solid var(--border); color: var(--text); background: var(--surface); }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .hero-img { margin-top: 2rem; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); max-width: 100%; }
    .hero-img img { width: 100%; display: block; }

    /* Layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 2rem; }
    section { padding: 3.5rem 0; border-bottom: 1px solid var(--border); }
    section h2 {
      font-size: 1.6rem; margin-bottom: .5rem;
      display: flex; align-items: center; gap: .75rem;
    }
    section h2 .num {
      display: inline-flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; border-radius: 8px;
      background: var(--accent); color: #000; font-size: .9rem; font-weight: 800;
    }
    .section-desc { color: var(--muted); margin-bottom: 2rem; max-width: 800px; }

    /* Nav tabs */
    .nav-sticky {
      position: sticky; top: 0; z-index: 100;
      background: rgba(11,15,20,.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: .75rem 0;
    }
    .nav-tabs {
      display: flex; gap: .5rem; overflow-x: auto; padding-bottom: .25rem;
      scrollbar-width: thin;
    }
    .nav-tab {
      flex-shrink: 0; padding: .4rem 1rem; border-radius: 8px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); font-size: .85rem; font-weight: 500;
      cursor: pointer; transition: all .2s; white-space: nowrap;
    }
    .nav-tab:hover { color: var(--text); background: var(--surface); }
    .nav-tab.active { background: var(--surface-2); border-color: var(--accent); color: var(--accent); }

    /* Architecture diagram */
    .arch-flow {
      display: grid; gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      align-items: stretch;
    }
    .arch-node {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem; text-align: center;
      position: relative; transition: transform .2s, border-color .2s;
      cursor: default;
    }
    .arch-node:hover { transform: translateY(-2px); border-color: var(--accent); }
    .arch-node .icon { font-size: 1.75rem; margin-bottom: .5rem; }
    .arch-node h4 { font-size: .9rem; margin-bottom: .25rem; }
    .arch-node p { font-size: .75rem; color: var(--muted); }
    .arch-node .model-tag {
      display: inline-block; margin-top: .5rem; padding: .15rem .5rem;
      border-radius: 4px; font-size: .65rem; font-weight: 600;
      background: var(--surface-2); color: var(--cyan);
    }
    .arch-arrow {
      display: none;
    }
    @media (min-width: 900px) {
      .arch-flow { grid-template-columns: repeat(7, 1fr); }
    }

    /* Pipeline timeline */
    .pipeline { display: flex; flex-direction: column; gap: 0; }
    .phase {
      display: grid; grid-template-columns: 48px 1fr; gap: 1.25rem;
      position: relative;
    }
    .phase:not(:last-child) .phase-line::after {
      content: ""; position: absolute; left: 23px; top: 48px; bottom: 0;
      width: 2px; background: var(--border);
    }
    .phase-dot {
      width: 48px; height: 48px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: .9rem; flex-shrink: 0;
      border: 2px solid var(--border); background: var(--surface);
      position: relative; z-index: 1; transition: all .3s;
    }
    .phase.active .phase-dot { border-color: var(--accent); background: var(--accent); color: #000; }
    .phase-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); margin-bottom: 1.25rem;
      overflow: hidden; transition: border-color .3s;
    }
    .phase.active .phase-card { border-color: var(--accent-dim); }
    .phase-header {
      padding: 1.25rem 1.5rem; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      user-select: none;
    }
    .phase-header:hover { background: var(--surface-2); }
    .phase-title { font-size: 1.05rem; font-weight: 600; }
    .phase-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .35rem; }
    .tag {
      font-size: .7rem; padding: .15rem .5rem; border-radius: 4px;
      font-weight: 600; letter-spacing: .02em;
    }
    .tag-llm { background: rgba(77,163,255,.15); color: var(--blue); }
    .tag-vlm { background: rgba(167,139,250,.15); color: var(--purple); }
    .tag-3d { background: rgba(251,146,60,.15); color: var(--orange); }
    .tag-sim { background: rgba(34,211,238,.15); color: var(--cyan); }
    .tag-agent { background: rgba(118,185,0,.15); color: var(--accent); }
    .tag-opt { background: rgba(244,114,182,.15); color: var(--pink); }
    .chevron { transition: transform .3s; color: var(--muted); font-size: 1.2rem; }
    .phase.open .chevron { transform: rotate(180deg); }
    .phase-body { display: none; padding: 0 1.5rem 1.5rem; border-top: 1px solid var(--border); }
    .phase.open .phase-body { display: block; }
    .step-list { list-style: none; margin-top: 1rem; }
    .step-list li {
      padding: .75rem 0; border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: start;
    }
    .step-list li:last-child { border-bottom: none; }
    .step-num {
      width: 28px; height: 28px; border-radius: 6px;
      background: var(--surface-2); display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; color: var(--muted); flex-shrink: 0;
    }
    .step-content h5 { font-size: .9rem; margin-bottom: .25rem; }
    .step-content p { font-size: .82rem; color: var(--muted); }
    .step-content .file-ref {
      font-family: var(--mono); font-size: .72rem; color: var(--cyan);
      margin-top: .35rem; display: block;
    }
    .prompt-link {
      display: inline-flex; align-items: center; gap: .35rem;
      margin-top: .5rem; padding: .3rem .75rem; border-radius: 6px;
      background: rgba(118,185,0,.1); color: var(--accent);
      border: 1px solid rgba(118,185,0,.3);
      font-size: .75rem; font-weight: 600; cursor: pointer;
      transition: all .2s;
    }
    .prompt-link:hover { background: rgba(118,185,0,.2); }

    /* Prompt explorer */
    .prompt-tabs {
      display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem;
    }
    .prompt-tab {
      padding: .5rem 1rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--muted); font-size: .8rem; cursor: pointer; transition: all .2s;
    }
    .prompt-tab:hover { color: var(--text); }
    .prompt-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(118,185,0,.08); }
    .prompt-panel { display: none; }
    .prompt-panel.active { display: block; }
    .prompt-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
    }
    .prompt-card-header {
      padding: 1rem 1.25rem; background: var(--surface-2);
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      flex-wrap: wrap;
    }
    .prompt-card-header h4 { font-size: .95rem; }
    .prompt-meta { display: flex; gap: .5rem; flex-wrap: wrap; }
    .prompt-body {
      padding: 1.25rem; max-height: 480px; overflow-y: auto;
      font-family: var(--mono); font-size: .78rem; line-height: 1.7;
      white-space: pre-wrap; color: #c8d6e5;
      background: #0d1117;
    }
    .copy-btn {
      padding: .35rem .75rem; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-size: .75rem;
      cursor: pointer; transition: all .2s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--accent); color: var(--accent); }

    /* Model matrix */
    .model-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem;
    }
    .model-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
    }
    .model-card h4 { font-size: .95rem; margin-bottom: .5rem; color: var(--accent); }
    .model-card .model-name {
      font-family: var(--mono); font-size: .8rem; color: var(--cyan);
      margin-bottom: .75rem; display: block;
    }
    .model-tasks { list-style: none; }
    .model-tasks li {
      font-size: .8rem; color: var(--muted); padding: .25rem 0;
      padding-left: 1rem; position: relative;
    }
    .model-tasks li::before {
      content: "→"; position: absolute; left: 0; color: var(--accent);
    }

    /* MCP tools */
    .mcp-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;
    }
    .mcp-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.25rem;
    }
    .mcp-card code {
      font-family: var(--mono); font-size: .85rem; color: var(--cyan);
      display: block; margin-bottom: .5rem;
    }
    .mcp-card p { font-size: .82rem; color: var(--muted); }

    /* Critics loop diagram */
    .loop-diagram {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: .75rem; padding: 2rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      margin-top: 1.5rem;
    }
    .loop-box {
      padding: .75rem 1.25rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface-2);
      font-size: .85rem; font-weight: 600; text-align: center; min-width: 120px;
    }
    .loop-arrow { color: var(--accent); font-size: 1.25rem; font-weight: 700; }

    /* Footer */
    footer {
      padding: 2rem; text-align: center; color: var(--muted); font-size: .8rem;
    }
    footer a { color: var(--accent); text-decoration: none; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 640px) {
      .hero { padding: 2.5rem 1rem 2rem; }
      .container { padding: 0 1rem; }
      section { padding: 2.5rem 0; }
    }

    .sage-site-topbar {
      position: sticky; top: 0; z-index: 200;
      background: rgba(11,15,20,.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); padding: .65rem 2rem;
    }
    .sage-site-topbar-inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; flex-wrap: wrap; align-items: center; gap: .75rem;
    }
    .sage-site-back { color: var(--muted); text-decoration: none; font-size: .85rem; font-weight: 500; }
    .sage-site-back:hover { color: var(--accent); }
    .sage-site-sep { color: var(--border); }
    .sage-site-label { margin-left: auto; font-size: .8rem; color: var(--muted); }
    @media (max-width: 640px) {
      .sage-site-topbar { padding: .65rem 1rem; }
      .sage-site-label { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
<div id="blog-encrypted-root" class="blog-encrypted-root" data-enc="flow-guide.enc.json" hidden aria-hidden="true">
  <p class="blog-encrypted-placeholder">内容已加密，请输入访问密码解锁。</p>
</div>
<script src="../../site-paths.js"></script>
<script>
(function () {
  function fixHref(id, fallback) {
    var el = document.getElementById(id);
    if (!el) return;
    if (window.SITE_PATHS) {
      if (id === 'site-back-blogs' && window.SITE_PATHS.blogs) el.href = window.SITE_PATHS.blogs;
      if (id === 'site-back-home' && window.SITE_PATHS.home) el.href = window.SITE_PATHS.home;
    } else {
      el.href = fallback;
    }
  }
  fixHref('site-back-blogs', '../');
  fixHref('site-back-home', '../../');
})();
</script>
</body>
</html>
