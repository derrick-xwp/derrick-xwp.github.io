      position: relative;
      z-index: 1;
      max-width: 1720px;

      padding: 1.5rem 1rem 3rem;

      letter-spacing: 0.05em;

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    header .sub {
      margin-top: 0.5rem;
      font-size: 1rem;
      line-height: 1.65;
      color: var(--text-dim);

      height: 3px;

      display: none;
      position: absolute;
      left: 0;
      top: calc(100% + 6px);
      z-index: 2147483647;
      min-width: min(360px, 72vw);
      max-width: min(400px, 86vw);

      font-size: 12px;
      line-height: 1.65;
      font-weight: 500;

      pointer-events: none;

      var laneXs = {
        1: [52, 577, 1102],
        2: [52, 446, 840, 1234],
        3: [52, 577, 1102],
        4: [52, 577, 1102]
      };

      // ================= 彻底修复错位问题的核心坐标系 =================
      var PILL_INNER_W13 = 525; // 3列宽
      var PILL_INNER_W2 = 394;  // 4列宽
      var PILL_PAD_R = 14;      // 右侧留白
      var PILL_GAP = 12;        // L3 内部双列间距
      var PILL_H = embed ? 54 : 44;
      
      // 修复横向遮盖：统一硬编码最安全的横向偏移量（保证不遮挡左侧任意长文本）
      var L13_TEXT_SAFE = 215; 
      var L2_TEXT_SAFE = 205;  

      // 修复纵向溢出：彻底放弃相对数值，强行绑定到节点之间绝对且安全的留白区域
      // (完美规避所有层级 Title 和 SVG 圆点文字)
      var L1_SLOT_TOP = [316, 386, 456, 526, 596];
      var L2_SLOT_TOP = [972, 1050, 1128, 1220, 1298];
      var L3_SLOT_TOP = [1606, 1684, 1768, 1852, 1936];
      var L3_LANE1_ROW_TOP = [1606, 1666, 1726, 1786, 1846, 1906, 1966, 2026, 2086];
      var L4_SLOT_TOP = [2396, 2466, 2546, 2638, 2718];

      function sliceSlotsCentered(slots, count) {
        if (count <= 0 || !slots.length) return [];
        if (count >= slots.length) return slots.slice();
        var start = Math.floor((slots.length - count) / 2);
        return slots.slice(start, start + count);
      }

      function paperBox(layer, lane, indexInLane, countInLane) {
        var lx = laneXs[layer][lane];
        var h = PILL_H;
        var textSafe = (layer === 2) ? L2_TEXT_SAFE : L13_TEXT_SAFE;
        var innerW = (layer === 2) ? PILL_INNER_W2 : PILL_INNER_W13;
        var wFull = innerW - textSafe - PILL_PAD_R; // 单列胶囊最大安全宽度

        // L3 轴Ⅱ（双列自适应布局，处理长列表不断行）
        if (layer === 3 && lane === 1) {
          var split = Math.ceil(countInLane / 2);
          var col = indexInLane < split ? 0 : 1;
          var row = col === 0 ? indexInLane : indexInLane - split;
          
          var wHalf = Math.floor((wFull - PILL_GAP) / 2);
          var wRight = wFull - PILL_GAP - wHalf;
          
          var x0 = lx + textSafe;
          var x1 = x0 + wHalf + PILL_GAP;
          var x = col === 0 ? x0 : x1;
          var w = col === 0 ? wHalf : wRight;
          
          // 容错补充（当论文量增加超标时自动往下排）
          var yRow = L3_LANE1_ROW_TOP[row];
          if (typeof yRow !== 'number') {
            yRow = L3_LANE1_ROW_TOP[L3_LANE1_ROW_TOP.length - 1] + (row - L3_LANE1_ROW_TOP.length + 1) * 60;
          }
          return { x: x, y: yRow, w: w, h: h };
        }

        // 常规单列（L1 / L2 / L3 其他列 / L4）
        var slots = layer === 1 ? L1_SLOT_TOP : (layer === 2 ? L2_SLOT_TOP : (layer === 4 ? L4_SLOT_TOP : L3_SLOT_TOP));
        var ys = sliceSlotsCentered(slots, countInLane);
        var y = ys[indexInLane];

        // 高度容错补充（极少触发）
        if (typeof y !== 'number') {
          var step = layer === 2 ? 80 : (layer === 4 ? 68 : 70);
          y = slots[slots.length - 1] + (indexInLane - slots.length + 1) * step;
        }

        return { x: lx + textSafe, y: y, w: wFull, h: h };
      }

      function layerGroupId(layer) {
        if (layer === 1) return 'l1-risk-axes';
        if (layer === 2) return 'l2-risk-axes';
        if (layer === 3) return 'l3-risk-axes';
        if (layer === 4) return 'l4-risk-axes';
        return 'l1-risk-axes';
      }

      function appendPaperFo(host, p, box) {
        var fo = document.createElementNS(SVG_NS, 'foreignObject');
        fo.setAttribute('overflow', 'visible');
        fo.setAttribute('x', String(Math.round(box.x)));
        fo.setAttribute('y', String(Math.round(box.y)));
        fo.setAttribute('width', String(Math.round(box.w)));
        fo.setAttribute('height', String(Math.round(box.h)));
        var wrap = document.createElementNS(XHTML_NS, 'div');
        wrap.setAttribute('xmlns', XHTML_NS);
        wrap.className = 'paper-badge-wrap';
        var div = document.createElementNS(XHTML_NS, 'div');
        div.className = 'axis-paper-block' + (p.layer === 2 ? ' layer2' : p.layer === 3 ? ' layer3' : p.layer === 4 ? ' layer-l4' : '');
        var pv = document.createElementNS(XHTML_NS, 'span');
        pv.className = 'pv';
        pv.textContent = p.venue;
        var tit = document.createElementNS(XHTML_NS, 'span');
        tit.className = 'paper-short';
        tit.textContent = p.short;
        div.appendChild(pv);
        div.appendChild(tit);
        var tip = document.createElementNS(XHTML_NS, 'div');
        tip.className = 'paper-tooltip';
        tip.setAttribute('role', 'tooltip');
        tip.textContent = p.full.split('\n\n').join('\n');
        wrap.appendChild(div);
        wrap.appendChild(tip);
        fo.appendChild(wrap);
        host.appendChild(fo);

        /* SVG 中 foreignObject 的叠放由文档顺序决定，仅靠 CSS z-index 无法压过后插入的兄弟节点 */
        var restoreBefore = null;
        wrap.addEventListener('mouseenter', function () {
          var p = fo.parentNode;
          if (!p) return;
          restoreBefore = fo.nextSibling;
          p.appendChild(fo);
        });
        wrap.addEventListener('mouseleave', function () {
          var p = fo.parentNode;
          if (!p) return;
          if (restoreBefore && restoreBefore.parentNode === p) {
            p.insertBefore(fo, restoreBefore);
          }
        });

        requestAnimationFrame(function () {
          try {
            var minH = parseFloat(fo.getAttribute('height')) || 0;
            var need = Math.ceil(wrap.getBoundingClientRect().height) + 6;
            if (need > minH) fo.setAttribute('height', String(need));
          } catch (e) { /* ignore */ }
        });
      }

      var buckets = {};
      papers.forEach(function (p) {
        var k = p.layer + ':' + p.lane;
        if (!buckets[k]) buckets[k] = [];
        buckets[k].push(p);
      });

      Object.keys(buckets).forEach(function (k) {
        var list = buckets[k];
        var layer = list[0].layer;
        var lane = list[0].lane;
        var host = document.getElementById(layerGroupId(layer));
        if (!host) return;
        list.forEach(function (p, i) {
          var box = paperBox(layer, lane, i, list.length);
